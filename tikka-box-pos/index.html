<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#b91c1c" />
  <title>Tikka Box POS</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Tikka Box POS</h1>
      <p>Indian Food • Fast Checkout</p>
    </div>
    <button id="settingsBtn" class="secondary">Menu & Settings</button>
  </header>

  <main class="layout">
    <section class="menu-panel">
      <div id="categoryTabs" class="tabs"></div>
      <div id="menuGrid" class="menu-grid"></div>
    </section>

    <aside class="cart-panel">
      <div class="order-type">
        <button class="type-btn active" data-type="Pickup">Pickup</button>
        <button class="type-btn" data-type="Dine-in">Dine-in</button>
      </div>

      <div id="cartItems" class="cart-items"></div>

      <label class="field-label" for="orderNotes">Order notes</label>
      <textarea id="orderNotes" placeholder="Extra spicy, no onions, etc."></textarea>

      <div class="totals">
        <div><span>Subtotal</span><strong id="subtotal">$0.00</strong></div>
        <div><span>Tax</span><strong id="tax">$0.00</strong></div>
        <div class="grand"><span>Total</span><strong id="total">$0.00</strong></div>
      </div>

      <div class="checkout-buttons">
        <button id="cashBtn" class="cash">Cash</button>
        <button id="cardBtn" class="card">Card Terminal</button>
      </div>

      <div class="utility-buttons">
        <button id="clearBtn" class="danger">Clear Order</button>
        <button id="reportBtn" class="secondary">Daily Report</button>
      </div>
    </aside>
  </main>

  <dialog id="cashDialog">
    <form method="dialog" class="dialog-card">
      <h2>Cash Checkout</h2>
      <p>Total due: <strong id="cashTotal">$0.00</strong></p>
      <label>Cash received
        <input id="cashReceived" type="number" min="0" step="0.01" inputmode="decimal" />
      </label>
      <p>Change: <strong id="changeDue">$0.00</strong></p>
      <div class="dialog-actions">
        <button value="cancel" class="secondary">Cancel</button>
        <button id="completeCashBtn" value="default" class="cash">Complete Sale</button>
      </div>
    </form>
  </dialog>

  <dialog id="settingsDialog">
    <form method="dialog" class="dialog-card wide">
      <h2>Menu & Settings</h2>
      <div class="settings-row">
        <label>Sales tax %
          <input id="taxRateInput" type="number" min="0" max="20" step="0.1" />
        </label>
        <button id="saveTaxBtn" type="button" class="secondary">Save Tax</button>
      </div>

      <h3>Add or edit menu item</h3>
      <input id="editId" type="hidden" />
      <div class="form-grid">
        <label>Name<input id="itemName" type="text" /></label>
        <label>Category<input id="itemCategory" type="text" placeholder="Bowls, Combos..." /></label>
        <label>Price<input id="itemPrice" type="number" min="0" step="0.01" /></label>
        <label class="checkbox-label"><input id="itemSoldOut" type="checkbox" /> Sold out</label>
      </div>
      <div class="dialog-actions left">
        <button id="saveItemBtn" type="button" class="cash">Save Item</button>
        <button id="resetItemBtn" type="button" class="secondary">Clear Form</button>
      </div>

      <h3>Current menu</h3>
      <div id="settingsMenuList" class="settings-list"></div>

      <div class="dialog-actions">
        <button value="cancel" class="secondary">Close</button>
      </div>
    </form>
  </dialog>

  <dialog id="reportDialog">
    <form method="dialog" class="dialog-card wide">
      <h2>Daily Report</h2>
      <div id="reportContent"></div>
      <div class="dialog-actions">
        <button id="exportBtn" type="button" class="secondary">Export CSV</button>
        <button value="cancel" class="secondary">Close</button>
      </div>
    </form>
  </dialog>

  <template id="receiptTemplate">
    <div class="receipt">
      <h2>Tikka Box</h2>
      <p>220 N Beacon Blvd, Grand Haven, MI</p>
      <hr />
      <div class="receipt-body"></div>
      <hr />
      <p>Thank you!</p>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
